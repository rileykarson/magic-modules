name: mmv1

permissions:
  contents: read


on:
  push:
    branches:
      - main
      - 'FEATURE-BRANCH-*'
  merge_group:
    types: [checks_requested]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'merge_group' && format('mmv1-merge-group-{0}', github.event.merge_group.head_sha) || github.event_name == 'pull_request' && format('mmv1-pr-{0}', github.event.pull_request.number) || format('mmv1-commit-{0}', github.sha) }}
  cancel-in-progress: true

jobs:
  template-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: repo
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            repo/tools/template-check/go.sum
      - name: Check for invalid version guards
        run: |
          cd repo/tools/template-check
          tmpls=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- '../../*.tmpl' | sed 's=^=../../=g')
          tmpls=${tmpls//$'\n'/,}
          echo "$tmpls"
          if [[ -n "$tmpls" ]]; then
            go run main.go version-guard --file-list "$tmpls"
          fi
      - name: Check new product templates are linked
        id: new_templates
        run: |
          cd repo/tools/template-check
          newtmplfiles=$(git diff --name-only --diff-filter=A HEAD^1 HEAD -- '../../mmv1/*.tmpl' | sed 's=^=../../=g')
          if [ -n "$newtmplfiles" ]; then
            newtmplfiles=${newtmplfiles//$'\n'/,}
            echo "$newtmplfiles"
            go run main.go unused-tmpl --file-list "$newtmplfiles"
          fi
      - name: Check for legacy Apiary usage
        run: |
          cd repo/tools/template-check
          go run main.go disallow-legacy-apiary --base-ref HEAD^1
  lint-yaml:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: repo
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - name: Find YAML files to lint
        id: yaml_files
        run: |
          cd repo
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            # For PRs, get only changed files
            yamlfiles=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- 'mmv1/products/*.yaml' 'mmv1/products/*.yml')
            if [ -n "$yamlfiles" ]; then
              echo "yamlfiles=${yamlfiles//$'\n'/ }" >> "$GITHUB_OUTPUT"
            fi
          else
            # For other events, get all YAML files
            echo "yamlfiles=all" >> "$GITHUB_OUTPUT"
          fi
      - name: Install yamllint
        if: ${{ !failure() && steps.yaml_files.outputs.yamlfiles != '' }}
        run: pip install yamllint==1.32.0 pyyaml==6.0.1 pathspec==0.12.1 --no-deps
      - name: Lint YAML files
        if: ${{ !failure() && steps.yaml_files.outputs.yamlfiles != '' }}
        run: |
          cd repo
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            printf '%s\n' ${STEPS_YAML_FILES_OUTPUTS_YAMLFILES} | xargs -r -P "$(nproc)" -n 200 yamllint -c .yamllint
          else
            find mmv1/products \( -name "*.yaml" -o -name "*.yml" \) -print0 | xargs -0 -r -P "$(nproc)" -n 200 yamllint -c .yamllint
          fi
        env:
          STEPS_YAML_FILES_OUTPUTS_YAMLFILES: ${{ steps.yaml_files.outputs.yamlfiles }}
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: repo
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            repo/mmv1/go.sum

      - name: Run mmv1 unit tests
        run: |
          cd repo
          cd mmv1
          go test ./...

